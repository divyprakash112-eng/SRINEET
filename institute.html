<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="theme-color" content="#061A40">

  <title>Institute | SRINEET</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">


  <style>

    :root {
      --navy: #061A40;
      --blue: #0B4FD8;
      --electric: #1687FF;
      --cyan: #20C4E8;
      --bg: #F6F9FD;
      --white: #FFFFFF;
      --text: #0B1F44;
      --muted: #6F819D;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      margin: 0;
      font-family: Inter, sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }


    /* HEADER */

    .institute-header {
      position: sticky;
      top: 0;
      z-index: 1000;

      height: 68px;

      display: flex;
      align-items: center;

      padding: 0 22px;

      background: rgba(255,255,255,.94);
      backdrop-filter: blur(18px);

      border-bottom: 1px solid rgba(6,26,64,.06);
    }

    .back-btn {
      width: 40px;
      height: 40px;

      display: grid;
      place-items: center;

      border-radius: 13px;

      color: var(--navy);
      background: #F1F5FA;

      font-size: 22px;

      cursor: pointer;
    }

    .page-brand {
      margin-left: auto;
      margin-right: auto;

      text-align: center;

      transform: translateX(-20px);
    }

    .page-brand strong {
      display: block;

      color: var(--navy);

      font-size: 18px;
      font-weight: 900;
      letter-spacing: -.5px;
    }

    .page-brand span {
      display: block;

      margin-top: 3px;

      color: var(--muted);

      font-size: 6px;
      font-weight: 800;

      text-transform: uppercase;
      letter-spacing: 1px;
    }


    /* HERO */

    .institute-hero {

      position: relative;
      overflow: hidden;

      padding: 50px 22px;

      color: white;

      background:
        linear-gradient(
          135deg,
          #061A40,
          #0B4FD8
        );

    }

    .institute-hero-inner {
      position: relative;
      z-index: 2;

      width: min(1100px, 100%);
      margin: auto;
    }

    .breadcrumb {
      color: rgba(255,255,255,.56);

      font-size: 9px;
      font-weight: 700;

      margin-bottom: 22px;
    }

    .institute-logo-large {

      width: 82px;
      height: 82px;

      display: grid;
      place-items: center;

      padding: 10px;

      border-radius: 23px;

      background: white;

      box-shadow:
        0 15px 40px rgba(0,0,0,.15);

    }

    .institute-logo-large img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .institute-logo-text {
      color: var(--navy);

      font-size: 16px;
      font-weight: 900;

      text-align: center;
    }

    .institute-hero h1 {
      margin-top: 20px;

      font-size: clamp(33px, 6vw, 54px);

      letter-spacing: -2px;
      line-height: 1.05;
    }

    .institute-hero p {
      max-width: 550px;

      margin-top: 11px;

      color: rgba(255,255,255,.68);

      font-size: 12px;
      line-height: 1.7;
    }

    .hero-pills {
      display: flex;
      flex-wrap: wrap;

      gap: 8px;

      margin-top: 22px;
    }

    .hero-pill {
      padding: 8px 11px;

      border-radius: 999px;

      color: rgba(255,255,255,.8);

      background: rgba(255,255,255,.10);

      font-size: 8px;
      font-weight: 800;
    }


    /* CONTENT */

    .batch-section {
      width: min(1100px, calc(100% - 44px));

      margin: auto;

      padding: 55px 0 85px;
    }

    .section-label {
      color: var(--blue);

      font-size: 9px;
      font-weight: 900;

      letter-spacing: 1.8px;
    }

    .batch-section h2 {
      margin-top: 8px;

      color: var(--navy);

      font-size: clamp(27px, 4vw, 40px);

      letter-spacing: -1.5px;
    }

    .batch-section > p {
      margin-top: 9px;

      color: var(--muted);

      font-size: 12px;
    }


    /* BATCH GRID */

    .batch-grid {

      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 17px;

      margin-top: 28px;
    }

    .batch-card {

      position: relative;

      min-height: 190px;

      padding: 23px;

      display: flex;
      flex-direction: column;
      justify-content: space-between;

      border-radius: 25px;

      background: white;

      border: 1px solid rgba(11,79,216,.08);

      box-shadow:
        0 10px 30px rgba(6,26,64,.06);

      transition: .25s ease;

    }

    .batch-card:hover {
      transform: translateY(-4px);

      box-shadow:
        0 20px 45px rgba(6,26,64,.11);
    }

    .batch-top {
      display: flex;
      justify-content: space-between;
    }

    .batch-number {

      width: 32px;
      height: 32px;

      display: grid;
      place-items: center;

      border-radius: 10px;

      color: var(--blue);
      background: #EEF5FF;

      font-size: 9px;
      font-weight: 900;

    }

    .batch-arrow {

      width: 34px;
      height: 34px;

      display: grid;
      place-items: center;

      border-radius: 11px;

      color: var(--blue);
      background: #F3F7FD;

      font-size: 19px;

    }

    .batch-card h3 {

      margin-top: 20px;

      color: var(--navy);

      font-size: 21px;

      letter-spacing: -.6px;

    }

    .batch-card p {

      margin-top: 5px;

      color: var(--muted);

      font-size: 9px;
      font-weight: 600;

    }

    .batch-meta {

      display: flex;
      gap: 8px;

      margin-top: 14px;

    }

    .batch-meta span {

      padding: 6px 8px;

      border-radius: 8px;

      background: #F5F8FC;

      color: var(--muted);

      font-size: 7px;
      font-weight: 800;

    }


    /* FOOTER */

    .simple-footer {

      padding: 40px 22px;

      color: rgba(255,255,255,.65);

      background: var(--navy);

      text-align: center;

    }

    .simple-footer strong {

      color: white;

      font-size: 18px;
      font-weight: 900;

    }

    .simple-footer p {

      margin-top: 8px;

      font-size: 9px;

    }


    /* MOBILE */

    @media (max-width: 600px) {

      .institute-header {
        padding: 0 14px;
      }

      .institute-hero {
        padding: 42px 16px;
      }

      .batch-section {
        width: calc(100% - 32px);

        padding: 45px 0 65px;
      }

      .batch-grid {
        grid-template-columns: 1fr;
      }

    }

  </style>

</head>


<body>


  <!-- HEADER -->

  <header class="institute-header">

    <button class="back-btn"
            onclick="history.back()"
            aria-label="Go back">
      ←
    </button>

    <div class="page-brand">
      <strong>SRINEET</strong>
      <span>Complete NEET Preparation</span>
    </div>

  </header>


  <!-- HERO -->

  <section class="institute-hero">

    <div class="institute-hero-inner">

      <div class="breadcrumb">
        TEST SERIES / INSTITUTE
      </div>

      <div class="institute-logo-large">

        <img id="instituteLogo"
             src=""
             alt="">

        <div id="instituteLogoText"
             class="institute-logo-text">
        </div>

      </div>

      <h1 id="instituteName">
        Institute
      </h1>

      <p id="instituteDescription">
        Explore available NEET test series and batches.
      </p>

      <div class="hero-pills">

        <span class="hero-pill">
          NEET 2027
        </span>

        <span class="hero-pill">
          CBT Pattern
        </span>

        <span class="hero-pill">
          180 Minutes
        </span>

      </div>

    </div>

  </section>


  <!-- BATCHES -->

  <main>

    <section class="batch-section">

      <span class="section-label">
        AVAILABLE BATCHES
      </span>

      <h2>
        Choose your batch
      </h2>

      <p id="batchSubtitle">
        Select a batch to view its test papers.
      </p>

      <div class="batch-grid"
           id="batchGrid">
      </div>

    </section>

  </main>


  <footer class="simple-footer">

    <strong>SRINEET</strong>

    <p>
      Complete NEET Preparation
    </p>

  </footer>


  <script src="telegram-popup.js"></script>
  <script src="institute.js"></script>

</body>

</html>
